name: Bug Report
description: Create a report to help us reproduce and fix a problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide steps or sample CSV data to reproduce the issue.
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: Environment
      description: Browser, OS version, Node version.
    validations:
      required: false
