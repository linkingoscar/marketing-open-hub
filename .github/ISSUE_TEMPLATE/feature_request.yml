name: Feature Request
description: Suggest an idea or statistical method for Marketing Open Hub.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the proposed feature or statistical method.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the motivation.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Method
      description: Describe the statistical algorithm or workflow enhancement. If proposing a statistical method, please include academic reference citations (e.g. JMR, Marketing Science).
    validations:
      required: true
